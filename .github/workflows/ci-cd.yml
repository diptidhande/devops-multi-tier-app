name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Frontend Docker Image
      run: docker build -t your-dockerhub/frontend:latest ./frontend

    - name: Build Backend Docker Image
      run: docker build -t your-dockerhub/backend:latest ./backend

    - name: Push Frontend Image
      run: docker push your-dockerhub/frontend:latest

    - name: Push Backend Image
      run: docker push your-dockerhub/backend:latest