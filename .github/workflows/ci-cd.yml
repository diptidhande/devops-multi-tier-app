name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: diptidhande46667
        password: dckr_pat_drfqqZVuMP1qUHt-dy6Jhwxixlw 

    - name: Build Frontend Docker Image
      run: docker build -t diptidhande46667/frontend:latest ./frontend

    - name: Build Backend Docker Image
      run: docker build -t diptidhande46667/backend:latest ./backend

    - name: Push Frontend Image
      run: docker push diptidhande46667/frontend:latest

    - name: Push Backend Image
      run: docker push diptidhande46667/backend:latest
